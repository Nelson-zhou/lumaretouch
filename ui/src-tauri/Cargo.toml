[package]
name = "lumaretouch"
version = "1.12.0"
license = "GPL-3.0-or-later"
description = "LumaRetouch — Linux AI 人像精修"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 原生文件/目录选择（M9 裁决3）：路径输入框不能让用户手填一个不存在的目录。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.dev]
opt-level = 1
