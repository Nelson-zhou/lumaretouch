[package]
name = "lumaretouch"
version = "1.12.1"
license = "GPL-3.0-or-later"
description = "LumaRetouch — Linux AI 人像精修"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 原生文件/目录选择（M9 裁决3）：路径输入框不能让用户手填一个不存在的目录。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Promote existing locked registry crates for bounded review byte verification.
# base64 0.22.1: MIT; RustCrypto sha2 0.10.9: MIT OR Apache-2.0; no vendored code.
# Registry provenance and exact package checksums remain in Cargo.lock.
base64 = "=0.22.1"
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri already uses GTK 3; reuse its print dialog, GdkPixbuf and Cairo.
gtk = "0.18"
