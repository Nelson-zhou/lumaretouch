name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: 引擎测试（CPU 参考实现对拍）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv --version
      - name: 装依赖（仅 numpy + pillow + pytest，不拉 GPU 轮子）
        working-directory: engine
        run: uv sync --group dev
      - name: 单测
        working-directory: engine
        run: uv run --group dev pytest -q

  ui:
    name: UI 类型检查与构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: npm ci + tsc
        working-directory: ui
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: cargo check
        working-directory: ui/src-tauri
        run: cargo check

  # GPU 门禁：需要 self-hosted runner。用仓库 variable 开关，没 runner 时根本不该排队
  # （之前写 `if: github.repository != ''` 永远为真，结不上标签只会无限 waiting）。
  # 开启：Settings → Secrets and variables → Actions → Variables → HAS_ROCM_RUNNER = true
  probe-amd:
    name: GPU 打靶与内核预算（AMD / ROCm）
    if: vars.HAS_ROCM_RUNNER == 'true'
    runs-on: [self-hosted, rocm]
    env:
      PY: ${{ vars.LRT_ENGINE_PY || 'python3' }}
    steps:
      - uses: actions/checkout@v4
      # 安装前置检查与用户装包时跑的是同一个脚本，不另搭一套判定
      - name: 前置检查（设备真能用）
        run: bash packaging/preflight.sh "$PY"
      - name: 滤波内核预算（1280×800 ≤ 20 ms）
        # M0 实测：积分图 7.9 ms；退化成 avg_pool2d 写法要 99.7 ms。
        # 不卡这一条，算法层换个写法就能静悄悄吃掉一个数量级的帧率。
        run: |
          PYTHONPATH=engine/src LRT_KERNEL_BUDGET_MS=20 \
            "$PY" packaging/m0-pipeline-bench.py cuda 1280 800
      - name: 显存常驻路径预算（引擎一帧 ≤ 16 ms，且两条臂像素一致）
        # M1-2 之后对引擎侧的硬要求：一帧不得超一个帧周期（16.7 ms）。
        # 本步同时验常驻臂与搬运臂的像素一致（≤2 LSB），只快不错才算过。
        # 实测：1280×800 逐帧搬运 36.8 ms（不达标）→ 常驻 9.2 ms（达标）。
        run: |
          REPS=7 LRT_RESIDENT_BUDGET_MS=16 \
            "$PY" packaging/m1-vram-bench.py cuda 1280x800
      - name: 真图导入保真（strength=0 逐字节等于解码原图）
        # M1-3a 验收口径③进 CI：这一条破了，“推子归零即原图”就是假的。
        # 只看字节不看快慢（导入耗时在各机差异大，本机数据：冷首图 ~299 ms、后续 ~40 ms）。
        run: REPS=3 "$PY" packaging/m1-import-bench.py
      - name: 消除笔事件驱动（两臂逐字节相等 + 拖拽期零重算 + 孔内精度）
        # M1-4 的硬要求：一笔只在松手时算一次，拖滑块期间不得重跑修补；
        # 并且“快”必须与“同一件事”同时成立（缓存臂与重放臂上屏字节逐字节相等）。
        # 本机（RX 7600 XT / 产品档 672×848）：热路径 0.62 ms/帧 vs 每帧重放 16.50 ms（×26）、
        # 引擎侧事件 23.4–23.6 ms（预算 40）、float64 参考对拍 ≤0.001 LSB、孔内 MAE r≤16 ≤4.4 LSB。
        run: REPS=5 "$PY" packaging/m1-inpaint-bench.py
      - name: 拖滑块零推理（强度臂逐字节等于逐帧重算 + 内核不超预算）
        # M1-3c 自己的打靶，之前只在本机跑过——不上 CI 就等于“零推理”只有开发者
        # 本机证据。现在接进来：预算与字节对拍都是硬门禁。
        run: REPS=3 LRT_FRAMES=40 "$PY" packaging/m1-drag-bench.py
      - name: 质感磨皮（毛孔保留率 + 分带/重组两层缓存）
        # M2-a 的两条硬要求：① 成分已知靶上细带增益 ≥0.95、中带增益 ≤0.55（保孔且去斑）；
        # ② 只重组那条臂与每帧全重算臂上屏字节逐字节相等（快但不能换算法）。
        # 本机（RX 7600 XT）：孔 0.987 / 斑 0.402 / 边 0.929；产品档 9.49 → 0.534 ms（×17.8）；
        # GPU↔CPU 参考 0 LSB（积分图累加器换 float64 后两边算的是同一个精确和）。
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-skin-bench.py
      - name: 中性灰修容（档数精确 + 笔触带限 + db 两层常驻）
        # M2-a2 的三条硬要求：① 逐像素线性光比值等于 2^(exposure·带限场)（float32
        # 生产路径 2e-3、float64 参考 1e-5 两档）；② 带限把硬边笔触的边缘跳变压到
        # 盘心同量级（r=0 必须比 r=24 大 3 倍，否则“中性灰”其实是刷一块色）；
        # ③ db 常驻臂与每帧重算臂上屏字节逐字节相等。
        # 本机（RX 7600 XT）：产品档拖 strength 0.156 ms（无修容 0.170 ms，这层热路径
        # 零成本）、每帧重算 db 3.43 ms（×22）；GPU↔CPU 最大 1 LSB、系统偏移 −0.00002 LSB。
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-dnb-bench.py
      - name: 五官微调（TPS 作用面 + 缩放与重解同一件事 + 拖滑块零解算）
        # M2-b 的三条硬要求：① 紧支撑——窗外像素逐字节不动（瘦脸不许拖走背景）；
        # ② 控制点处位移等于请求值（≤2% 峰值）且纯轴请求的另一分量精确为 0；
        # ③ 缩放单位场与每帧重解 TPS 上屏字节逐字节相等，且拖滑块期间 deform_builds 不增。
        # 本机（RX 7600 XT / 产品档 672×848）：形变段 1.05 ms/帧 vs 每帧重解 53.7 ms（×41）、
        # 两臂最大 1 LSB（0.03% 像素，量化边界）、窗外改动 0 px、GPU−CPU 场 1e-13 px。
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-face-bench.py
      - name: 影楼色彩（3D LUT 保真与常驻 + 链尾不污染上游）
        # M3-a2 的四条硬要求：① 恒等表与强度 0 逐字节还原（且 lut_ms=0，走的是结构
        # 短路而不是“算出来恰好一样”）；② 线性表必须精确复现“夹域后走表”的解析真值
        # （只在量化边界 ±1e-3 LSB 上允许 float32 舍入翻牌）；③ 常驻臂与独立臂逐字节
        # 相等；④ 挂表后拖滑块：滤波/db/TPS 零重算，而 N 帧只许一次 to_device。
        # 本机（RX 7600 XT）：三档恒等与强度 0 均 0 LSB、线性表边界外 0 LSB（18/40/81
        # 个子像素全在边界上）、常驻=独立臂 0 LSB；调色段 0.333/0.587/1.375 ms（预算
        # 1.21/3.42/7.86）。“常驻比每帧重传快”实测只有 0.94–1.03×（33³ 表才 431 KB），
        # 所以这份跑靶不拿加速比当战果——真实价值在热路径零搬运零分配。
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m3-color-bench.py
      - name: 全尺寸分块导出（分块=整幅 + 峰值只随 tile 走 + margin 由参数算）
        # M4 的三条硬要求：① 逐点层（strength=0）分块逐字节相等，带滤波的臂只允许
        # 1 LSB 且差异像素占比有界；② 同 tile 同 margin 下图幅翻 3.8 倍而峰值不动，
        # 同尺寸单 pass 那一档则按图幅涨（本机 133.6 MiB vs 1126.3 MiB）；③ margin 逐参数
        # 等于公式，而且砍半必红且差异全贴在缝上。另有反向门禁：“导出 == 预览通路”
        # 逐字节（本机 0 LSB），否则“分块跑的是一条链”这句话可以靠抄一套实现来自证。
        run: REPS=3 LRT_EXPORT_BIG_MP=2 "$PY" packaging/m4-export-bench.py
      - name: 底片条（缩略图批量不挤坏帧通路 + 切文档逐字节拿回画面）
        # M5-a 的三条硬要求：① quiet / busy 两臂交错对拍，busy 臂的窗口正是整批缩略图
        # 在解码的那段——只看整场平均会把开头几秒的掉帧摊平，所以窗口 fps 单独判；
        # ② 切走再切回必须从 /dev/shm 读回逐字节相同的一帧（含消除笔那一笔），
        # 事件说 switched=true 而画面没重放，完全可以同时成立；③ 每轮的缩略图必须
        # 是全新的一批（count==found），否则吞吐的分母是被缓存命中的 0，会算出天文数字。
        # 本机（RX 7600 XT）：窗口 fps quiet 59.88 / busy 59.94（差 ±0.1）、丢帧 0.0%；
        # 吞吐 44~46 张/秒；切文档 import_ms 中位 16.2 / 最坏 21.5；40 张通道合计 141.6 KB。
        run: REPS=3 LRT_STRIP_N=40 LRT_STRIP_FRAMES=180 "$PY" packaging/m5-filmstrip-bench.py
      - name: M5-b 撤销/重做跑靶（保真 / 代价 / 内存账 / 手势合并）
        # 四节：① 五层各一步，撤到底必须从 /dev/shm 读回与出厂帧逐字节相同的一帧（0 LSB），
        # 重做到顶等于撤销前——两档代理尺寸各跑 REPS 次，先证明改动字节和 > 0（有鉴别力）；
        # ② 产品档上 40 次来回的 history_ms（中位 ≤30 / 最坏 ≤60 ms，本机实测 15.5/16.4），
        # 并判"栈深变了单次代价不许涨"；③ 灌满 64 步的 RSS 账（≤8 MiB，本机 +0.8）与五项
        # 常驻字节账单前后逐字段相同；④ 50 条连发合并成 1 步 vs 每步新增 50 步的逐条往返
        # （差 ≤2 ms，本机 0.14）。本机口径全部写进脚本头部注释，换口径必须同时改判据。
        run: REPS=3 LRT_DEVICE=cuda "$PY" packaging/m5-history-bench.py

  # NVIDIA 侧同理。本机无 N 卡，CUDA 依赖 pin 也尚未解析回填，
  # 在拿到 NVIDIA runner 之前这条只能是开关关闭，不能当作已验证。
  probe-nvidia:
    name: GPU 打靶（NVIDIA / CUDA）
    if: vars.HAS_CUDA_RUNNER == 'true'
    runs-on: [self-hosted, cuda]
    env:
      PY: ${{ vars.LRT_ENGINE_PY || 'python3' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/preflight.sh "$PY"
      - run: |
          PYTHONPATH=engine/src LRT_KERNEL_BUDGET_MS=20 \
            "$PY" packaging/m0-pipeline-bench.py cuda 1280 800
      # N 卡上没本机数据，预算先按与 ROCm 同一不超标；跑出真数再收紧
      - run: |
          REPS=7 LRT_RESIDENT_BUDGET_MS=16 \
            "$PY" packaging/m1-vram-bench.py cuda 1280x800
      - name: 真图导入保真（strength=0 逐字节等于解码原图）
        run: REPS=3 "$PY" packaging/m1-import-bench.py
      - name: 消除笔事件驱动（两臂逐字节相等 + 拖拽期零重算 + 孔内精度）
        run: REPS=5 "$PY" packaging/m1-inpaint-bench.py
      - name: 拖滑块零推理（强度臂逐字节等于逐帧重算 + 内核不超预算）
        # 预算与判据同 ROCm job；N 卡没本机数据，跑出真数后再按本机口径收紧
        run: REPS=3 LRT_FRAMES=40 "$PY" packaging/m1-drag-bench.py
      - name: 质感磨皮（毛孔保留率 + 分带/重组两层缓存）
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-skin-bench.py
      - name: 中性灰修容（档数精确 + 笔触带限 + db 两层常驻）
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-dnb-bench.py
      - name: 五官微调（TPS 作用面 + 缩放与重解同一件事 + 拖滑块零解算）
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m2-face-bench.py
      - name: 影楼色彩（3D LUT 保真与常驻 + 链尾不污染上游）
        # 判据与预算同 ROCm job；N 卡没本机数据，跑出真数后再按本机口径收紧
        run: REPS=5 LRT_FRAMES=40 "$PY" packaging/m3-color-bench.py
      - name: 全尺寸分块导出（分块=整幅 + 峰值只随 tile 走 + margin 由参数算）
        # 判据与预算同 ROCm job。RDNA3 的 FP64 是 1/32 速率，形变那一次场求值在 N 卡上
        # 会是大不同的数字——跑出真数后按本机口径改那两个预算，而不是改判据。
        run: REPS=3 LRT_EXPORT_BIG_MP=2 "$PY" packaging/m4-export-bench.py
      - name: 底片条（缩略图批量不挤坏帧通路 + 切文档逐字节拿回画面）
        # M5-a 的三条硬要求：① quiet / busy 两臂交错对拍，busy 臂的窗口正是整批缩略图
        # 在解码的那段——只看整场平均会把开头几秒的掉帧摊平，所以窗口 fps 单独判；
        # ② 切走再切回必须从 /dev/shm 读回逐字节相同的一帧（含消除笔那一笔），
        # 事件说 switched=true 而画面没重放，完全可以同时成立；③ 每轮的缩略图必须
        # 是全新的一批（count==found），否则吞吐的分母是被缓存命中的 0，会算出天文数字。
        # 本机口径见 ROCm job 注释：窗口 fps quiet 59.88 / busy 59.94（差 ±0.1）、丢帧 0.0%；
        # 吞吐 44~46 张/秒；切文档 import_ms 中位 16.2 / 最坏 21.5；40 张通道合计 141.6 KB。
        run: REPS=3 LRT_STRIP_N=40 LRT_STRIP_FRAMES=180 "$PY" packaging/m5-filmstrip-bench.py
      - name: M5-b 撤销/重做跑靶（保真 / 代价 / 内存账 / 手势合并）
        # 四节：① 五层各一步，撤到底必须从 /dev/shm 读回与出厂帧逐字节相同的一帧（0 LSB），
        # 重做到顶等于撤销前——两档代理尺寸各跑 REPS 次，先证明改动字节和 > 0（有鉴别力）；
        # ② 产品档上 40 次来回的 history_ms（中位 ≤30 / 最坏 ≤60 ms，本机实测 15.5/16.4），
        # 并判"栈深变了单次代价不许涨"；③ 灌满 64 步的 RSS 账（≤8 MiB，本机 +0.8）与五项
        # 常驻字节账单前后逐字段相同；④ 50 条连发合并成 1 步 vs 每步新增 50 步的逐条往返
        # （差 ≤2 ms，本机 0.14）。本机口径全部写进脚本头部注释，换口径必须同时改判据。
        run: REPS=3 LRT_DEVICE=cuda "$PY" packaging/m5-history-bench.py

  # 通路不回归：引擎层单测 + 脚本可跑。真正的端到端帧率验收需要图形环境，
  # 在 M0 阶段仍是本机跑 packaging/m0-bench.sh，不假称 CI 已覆盖。
  packaging:
    name: 打包脚本与暂存内容校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 只验语法，不用 py_compile：那会在仓库里留下 __pycache__
      - run: bash -n packaging/*.sh && python3 -c 'import ast,sys;[ast.parse(open(f).read(),f) for f in sys.argv[1:]]' packaging/*.py probe/*.py
      - name: 暂存引擎不应带字节码
        run: |
          bash packaging/stage-engine.sh
          if find ui/src-tauri/gen/engine-stage -name '*.pyc' -o -name '__pycache__' | grep -q .; then
            echo '发行暂存目录里混进了字节码'; exit 1
          fi
          test -f ui/src-tauri/gen/engine-stage/lumaretouch_engine/server.py
      - name: 发布静态门禁（版本号 / 元数据 / 运行时候选表 / 随包文件）
        # 这一条验的不是代码而是“发布物会不会骗人”：版本号八处（deb 的 Version 来自
        # tauri.conf.json，引擎在 ready 里报 __version__）、包描述是不是还写着旧里程碑、
        # setup-runtime.sh 的默认安装位置与 Rust 候选表字面一致不一致、许可未放行的
        # 清单有没有混进包里。这条门禁落地当天就报过一次红：sync 写完 0.9.0 后，
        # 改元数据那一步又把 tauri.conf.json 顶回了 0.0.1——而那正是 deb 的 Version 出处。
        run: bash packaging/check-release.sh

  # GPU 门禁不跑不能算绿。上面两个 job 开关关上时是 skipped，PR 检查页依旧全绿——
  # “没验证”必须从沉默变成一个看得见的提醒，否则下一次拿这份绿当 GPU 证据会没人质疑。
  gate-summary:
    name: 门禁覆盖回报
    runs-on: ubuntu-24.04
    if: always()
    needs: [engine, ui, packaging, probe-amd, probe-nvidia]
    steps:
      - name: 未被本次运行验证的 GPU 门禁
        env:
          ROCM: ${{ vars.HAS_ROCM_RUNNER }}
          CUDA: ${{ vars.HAS_CUDA_RUNNER }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          miss=""
          [ "$ROCM" = "true" ] || miss="${miss} AMD/ROCm 打靶（常驻预算、真图保真、消除笔、拖滑块零推理、质感磨皮保留率、中性灰修容）"
          [ "$CUDA" = "true" ] || miss="${miss} NVIDIA/CUDA 打靶"
          if [ -n "$miss" ]; then
            echo "::warning title=GPU 门禁未执行::以下项本轮没跑：${miss}"
            # 主干上把提醒提到错误级别：不阻断合入（没 runner 不是提交者的错），
            # 但也不允许它在一片绿勾里隐身
            if [ "$EVENT" = "push" ] && [ "$REF" = "main" ]; then
              echo "::error title=主干缺 GPU 证据·release 前必须在真机跑 packaging/m1-upload-matrix.sh 与 m1-import-bench.py::"
            fi
          fi
          echo "本轮验证：engine(CPU 对拍) / ui(tsc+cargo) / packaging；缺：${miss:-无}"
