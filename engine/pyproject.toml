[project]
name = "lumaretouch-engine"
version = "0.0.1"
description = "LumaRetouch 图像与推理引擎（GPU 管线 + 共享内存裸帧通路）"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=2.0"]

[project.scripts]
lumaretouch-engine = "lumaretouch_engine.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# ---- GPU 引擎变体：首启探测显卡后只装其中一组 ----
rocm = ["torch==2.10.0+rocm7.0", "torchvision==0.25.0+rocm7.0"]
cpu = []

# CUDA 变体的精确 pin 尚未确定：本机无 N 卡，不得凭空写死一个可能不存在的版本，
# 由带 NVIDIA runner 的 CI 首次解析后回填（见 docs/风险项「NVIDIA 未验证」）。
cuda = []

[[tool.uv.index]]
name = "rocm70"
url = "https://download.pytorch.org/whl/rocm7.0"
explicit = true

[[tool.uv.index]]
name = "cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "rocm70", group = "rocm" },
  { index = "cuda", group = "cuda" },
]
torchvision = [{ index = "rocm70", group = "rocm" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumaretouch_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
