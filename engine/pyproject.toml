[project]
name = "lumaretouch-engine"
version = "1.11.0"
description = "LumaRetouch 图像与推理引擎（GPU 管线 + 共享内存裸帧通路）"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }   # 见 docs/adr/0001；NOTICE 里的非商业告知随副本传递
# Pillow 用于真图解码（M1-3a）：许可 MIT-CMU（CMU 字库基金会那套 BSD 同族许可，
# 见 importlib.metadata 的 License-Expression），符合「依赖树零 GPL」那条约束
dependencies = ["numpy>=2.0", "pillow>=11"]

[project.scripts]
lumaretouch-engine = "lumaretouch_engine.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# ---- GPU 引擎变体：不进 uv group，走两个 requirements 文件 ----
# 为什么：uv 解析时会连可选 group 一起解，`uv sync --group dev`（CI 的 engine job）
# 也会因为 rocm 组里 torch==2.10.0+rocm7.0 依赖的 triton-rocm==3.6.0 在指定索引上
# 找不到而直接报 "no solution found"。GPU 轮子本来就按显卡型号现场装（preflight.sh
# 给的就是 pip 命令），把变体当依赖声明只会把一个没跑过的解析图塞进 CI。
#   AMD/ROCm：requirements-rocm.txt（本机已真装并跑过）
#   NVIDIA/CUDA：requirements-cuda.txt（pin 待 N 卡 runner 回填）
cpu = []

[tool.uv]
# uv 默认会把所有可选 group 一起装；这里显式只锁 dev，避开上面那个解析陷阱。
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumaretouch_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
